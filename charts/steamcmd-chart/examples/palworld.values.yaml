hby:
  ports:
    - {name: game, containerPort: 8211, servicePort: 8211, protocol: UDP}
    - {name: rcon, containerPort: 25575, servicePort: 25575, protocol: TCP}
  container:
    envFrom:
      - secretRef: {name: palworld-secrets}
    env:
      - {name: SERVER_PORT, value: "8211"}
      - {name: RCON_PORT, value: "25575"}
      - {name: SERVER_NAME, value: "Palworld Server"}
      - {name: MAX_PLAYERS, value: "32"}
  persistence:
    size: 30Gi
steamcmd:
  appId: "2394010"
  startup: './PalworldServerConfigParser; /home/container/Pal/Binaries/Linux/PalServer-Linux-Shipping Pal -publiclobby -useperfthreads -NoAsyncLoadingThread -UseMultithreadForDS -port={{SERVER_PORT}} -publicport={{SERVER_PORT}} -servername="{{SERVER_NAME}}" -players={{MAX_PLAYERS}} -adminpassword="{{ADMIN_PASSWORD}}" -rcon'
  bootstrap:
    enabled: true
    policy: IfChanged
    script: |
      parser_url="https://github.com/pelican-eggs/Palworld-Config-Parser-Tool/releases/download/v1.0.23/PalworldServerConfigParser-linux-amd64"
      parser_sha256="7ffe811548356416f874737aca289b3a854b74ab8b32f543a613b7a9677dea31"
      curl -fsSL "$parser_url" -o PalworldServerConfigParser
      echo "$parser_sha256  PalworldServerConfigParser" | sha256sum -c -
      chmod 0755 PalworldServerConfigParser
