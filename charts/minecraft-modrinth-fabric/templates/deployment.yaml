apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "minecraft-modrinth-fabric.fullname" . }}
  labels:
    {{- include "minecraft-modrinth-fabric.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "minecraft-modrinth-fabric.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/installer: {{ include (print $.Template.BasePath "/configmap-installer.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "minecraft-modrinth-fabric.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "minecraft-modrinth-fabric.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      initContainers:
        - name: install-modrinth-pack
          image: "{{ .Values.installerImage.repository }}:{{ .Values.installerImage.tag }}"
          imagePullPolicy: {{ .Values.installerImage.pullPolicy }}
          command:
            - /bin/sh
            - /installer/install-modrinth-pack.sh
          env:
            - name: SERVER_DIR
              value: {{ .Values.minecraft.dataDir | quote }}
            - name: SERVER_JARFILE
              value: {{ .Values.minecraft.serverJarFile | quote }}
            - name: MINECRAFT_EULA
              value: {{ ternary "true" "false" .Values.minecraft.eula | quote }}
            - name: MINECRAFT_EXTRA_JARS_JSON
              value: {{ default (list) .Values.minecraft.extraJars | toJson | quote }}
            - name: MODRINTH_AUTH_ENABLED
              value: {{ ternary "true" "false" .Values.modrinth.auth.enabled | quote }}
            - name: MODRINTH_AUTH_SCHEME
              value: {{ .Values.modrinth.auth.scheme | quote }}
            - name: MODRINTH_API_BASE
              value: {{ .Values.modrinth.apiBase | quote }}
            - name: MODRINTH_PROJECT_ID
              value: {{ .Values.modrinth.projectId | quote }}
            - name: MODRINTH_VERSION_ID
              value: {{ .Values.modrinth.versionId | quote }}
            - name: MODRINTH_VERSION_NUMBER
              value: {{ .Values.modrinth.versionNumber | quote }}
            - name: MODRINTH_USER_AGENT
              value: {{ .Values.modrinth.userAgent | quote }}
            - name: MODRINTH_INSTALL_POLICY
              value: {{ .Values.modrinth.installPolicy | quote }}
            - name: MODRINTH_PACK_URL
              value: {{ .Values.modrinth.pack.url | quote }}
            - name: MODRINTH_PACK_FILENAME
              value: {{ .Values.modrinth.pack.filename | quote }}
            - name: MODRINTH_PACK_SHA512
              value: {{ .Values.modrinth.pack.sha512 | quote }}
            - name: FABRIC_INSTALLER_VERSION
              value: {{ .Values.modrinth.fabricInstallerVersion | quote }}
            {{- if .Values.modrinth.auth.enabled }}
            - name: MODRINTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "minecraft-modrinth-fabric.tokenSecretName" . }}
                  key: {{ .Values.modrinth.auth.secretKey }}
            {{- end }}
          securityContext:
            {{- toYaml .Values.installerSecurityContext | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: {{ .Values.minecraft.dataDir | quote }}
            - name: installer
              mountPath: /installer
              readOnly: true
      containers:
        - name: minecraft
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          workingDir: {{ .Values.minecraft.dataDir | quote }}
          {{- with .Values.minecraft.command }}
          command:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.minecraft.commandArgs }}
          args:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          env:
            - name: STARTUP
              value: {{ .Values.minecraft.startup | quote }}
            - name: JAVA_OPTS
              value: {{ .Values.minecraft.javaOpts | quote }}
            - name: SERVER_JARFILE
              value: {{ .Values.minecraft.serverJarFile | quote }}
            - name: MINECRAFT_ARGS
              value: {{ .Values.minecraft.args | quote }}
            {{- with .Values.minecraft.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- if .Values.externalSecrets.enabled }}
          {{- $externalSecretItems := .Values.externalSecrets.items }}
          {{- if not $externalSecretItems }}
          {{- $externalSecretItems = list (dict "metadata" .Values.externalSecrets.metadata "spec" .Values.externalSecrets.spec) }}
          {{- end }}
          envFrom:
            {{- range $index, $externalSecret := $externalSecretItems }}
            {{- $metadata := default dict $externalSecret.metadata }}
            {{- $spec := default dict $externalSecret.spec }}
            - secretRef:
                name: {{ include "minecraft-modrinth-fabric.externalSecretTargetName" (dict "root" $ "metadata" $metadata "spec" $spec) }}
            {{- end }}
          {{- end }}
          ports:
            - name: minecraft
              containerPort: 25565
              protocol: TCP
            {{- with .Values.minecraft.extraPorts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- if .Values.probes.enabled }}
          readinessProbe:
            tcpSocket:
              port: {{ .Values.probes.port }}
            {{- toYaml .Values.probes.readiness | nindent 12 }}
          livenessProbe:
            tcpSocket:
              port: {{ .Values.probes.port }}
            {{- toYaml .Values.probes.liveness | nindent 12 }}
          {{- end }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: {{ .Values.minecraft.dataDir | quote }}
      volumes:
        - name: installer
          configMap:
            name: {{ include "minecraft-modrinth-fabric.installerConfigMapName" . }}
            defaultMode: 0555
        - name: data
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "minecraft-modrinth-fabric.pvcName" . }}
          {{- else }}
          emptyDir: {}
          {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
