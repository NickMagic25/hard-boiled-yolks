{{- if .Values.externalSecrets.enabled -}}
{{- $root := . -}}
{{- $items := .Values.externalSecrets.items -}}
{{- if not $items -}}
{{- $items = list (dict "metadata" .Values.externalSecrets.metadata "spec" .Values.externalSecrets.spec) -}}
{{- end -}}
{{- range $index, $externalSecret := $items }}
{{- $metadata := default dict $externalSecret.metadata -}}
{{- $spec := default dict $externalSecret.spec -}}
{{- $target := default dict $spec.target -}}
{{- $name := include "minecraft-modrinth-fabric.externalSecretName" (dict "root" $root "metadata" $metadata) -}}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $name }}
  namespace: {{ default $root.Release.Namespace $metadata.namespace }}
  labels:
    {{- include "minecraft-modrinth-fabric.labels" $root | nindent 4 }}
    {{- with $metadata.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with $metadata.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with $spec.refreshInterval }}
  refreshInterval: {{ . }}
  {{- end }}
  secretStoreRef:
    {{- toYaml (required "externalSecrets spec.secretStoreRef is required" $spec.secretStoreRef) | nindent 4 }}
  target:
    name: {{ include "minecraft-modrinth-fabric.externalSecretTargetName" (dict "root" $root "metadata" $metadata "spec" $spec) }}
    {{- with omit $target "name" }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- with $spec.data }}
  data:
    {{- toYaml . | nindent 4 }}
{{ end }}
{{- with $spec.dataFrom }}
  dataFrom:
    {{- toYaml . | nindent 4 }}
{{ end }}
{{- end }}
{{- end }}
