minecraft:
  eula: true
  javaOpts: "-Xms128M -Xmx8192M"
  extraPorts:
    - name: control
      containerPort: 8080
      protocol: TCP
  extraEnv:
    - name: HBY_CONTROL_ADDR
      value: 0.0.0.0:8080
    - name: HBY_CONTROL_ROOT
      value: /home/container

image:
  repository: harbor.edrisil.net/hard-boiled-yolks/java_25
  tag: latest

installerImage:
  repository: harbor.edrisil.net/hard-boiled-yolks/installer_modrinth
  tag: latest

service:
  extraPorts:
    - name: control
      port: 8080
      targetPort: control
      protocol: TCP

modrinth:
  projectId: VJ4jg3DP
  versionId: K5CPsQs7
  versionNumber: 1.0.0
  fabricInstallerVersion: "1.0.3"
  pack:
    filename: Essential Sodium and More 1.0.0.mrpack
    url: https://cdn.modrinth.com/data/VJ4jg3DP/versions/K5CPsQs7/Essential%20Sodium%20and%20More%201.0.0.mrpack
    sha512: 44133dd49603de92ee40030644008de9c57945eef190df25e5af8c35066e9aafe6a8d2b55596f907ae1e025b1ac81ac8b7be4e299460483344c199332b7d40fe
  auth:
    existingSecret: minecraft-modrinth-token

externalSecrets:
  enabled: true
  metadata:
    name: minecraft-modrinth-token
  spec:
    refreshInterval: 1h
    secretStoreRef:
      kind: ClusterSecretStore
      name: openbao
    target:
      name: minecraft-modrinth-token
      creationPolicy: Owner
    data:
      - secretKey: MODRINTH_TOKEN
        remoteRef:
          key: minecraft
          property: MODRINTH_TOKEN

gatewayIngress:
  enabled: true
  data:
    - kind: TCPRoute
      name: minecraft
      hostname: minecraft.edrisil.net
      externalDNS: true
      port: 25565
      spec:
        parentRefs:
          - name: game-servers-gateway
            namespace: gateway-system
            sectionName: minecraft
          - name: tailscale-gateway
            namespace: tailscale
            sectionName: minecraft
        rules:
          - {}
    - kind: HTTPRoute
      name: minecraft-control
      hostnames:
        - minecraft-control.edrisil.net
      port: 8080
      spec:
        parentRefs:
          - name: internal-apps-gateway
            namespace: gateway-system
            sectionName: https
        rules:
          - matches:
              - path:
                  type: PathPrefix
                  value: /
    - kind: HTTPRoute
      name: minecraft-control-redirect
      hostnames:
        - minecraft-control.edrisil.net
      spec:
        parentRefs:
          - name: internal-apps-gateway
            namespace: gateway-system
            sectionName: http
        rules:
          - matches:
              - path:
                  type: PathPrefix
                  value: /
            filters:
              - type: RequestRedirect
                requestRedirect:
                  scheme: https
                  statusCode: 301
    - kind: HTTPRoute
      name: minecraft-control-tailscale
      hostnames:
        - minecraft-control.edrisil.net
      port: 8080
      spec:
        parentRefs:
          - name: tailscale-admin-gateway
            namespace: tailscale
            sectionName: https
        rules:
          - matches:
              - path:
                  type: PathPrefix
                  value: /
    - kind: HTTPRoute
      name: minecraft-control-tailscale-redirect
      hostnames:
        - minecraft-control.edrisil.net
      spec:
        parentRefs:
          - name: tailscale-admin-gateway
            namespace: tailscale
            sectionName: http
        rules:
          - matches:
              - path:
                  type: PathPrefix
                  value: /
            filters:
              - type: RequestRedirect
                requestRedirect:
                  scheme: https
                  statusCode: 301
