package:
  name: xmake-hard-boiled-yolks
  version: 3.0.4
  epoch: 0
  description: Pinned xmake bundle for local Skyrim Together melange builds
  target-architecture:
    - x86_64
  copyright:
    - license: Apache-2.0
  scriptlets:
    post-install: |
      chmod 0755 /usr /usr/bin /usr/bin/xmake

environment:
  contents:
    repositories:
      - https://packages.wolfi.dev/os
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    packages:
      - bash
      - busybox
      - ca-certificates-bundle
      - curl

pipeline:
  - runs: |
      set -eux
      umask 022

      asset="xmake-bundle-v${{package.version}}.linux.x86_64"
      url="https://github.com/xmake-io/xmake/releases/download/v${{package.version}}/${asset}"

      curl -fLso xmake "${url}"
      echo "b3cd0f9fe3b3df8d767f301e382b70071b8335abe00ada00525ba9e13e238717  xmake" | sha256sum -c -

      install -d -m 0755 "${{targets.destdir}}/usr/bin"
      cp xmake "${{targets.destdir}}/usr/bin/xmake"
      chmod 0755 "${{targets.destdir}}/usr" "${{targets.destdir}}/usr/bin"
      chmod 0755 "${{targets.destdir}}/usr/bin/xmake"
